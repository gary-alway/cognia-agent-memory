services:
  neo4j:
    image: neo4j:5.15.0
    container_name: cognia-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    tmpfs:
      - /var/lib/neo4j/run:uid=7474,gid=7474
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-bootstrap:
    image: node:22-alpine
    container_name: cognia-schema-bootstrap
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    command: sh -c "apk add --no-cache yarn && yarn install && yarn bootstrap"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: cognia-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  minio_data:


